# The iOS app's Xcode project, generated — never edited or committed:
#   cd ios && xcodegen          → ios/Glassine.xcodeproj
# The Mac app needs no project (Package.swift + build.sh). iOS does, because
# the Swift package manager cannot assemble an iOS app by itself. Both compile
# Sources/Shared; this one adds Sources/iOS where the Mac adds Sources/Mac.
name: Glassine
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Glassine:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/Shared
      - path: ../Sources/iOS
      - path: ../Resources/wordmark.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlibre.glassine
        PRODUCT_NAME: Glassine
        MARKETING_VERSION: "0.2.17"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Every iOS app is a store app: sandboxed, its own iCloud container, no updater.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glassine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
